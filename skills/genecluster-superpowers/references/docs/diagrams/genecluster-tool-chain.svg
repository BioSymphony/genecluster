<svg xmlns="http://www.w3.org/2000/svg" width="960" height="218" viewBox="0 0 960 218" role="img" aria-labelledby="title desc">
  <title id="title">A protein annotation workflow</title>
  <desc id="desc">MMseqs2 returns hit IDs and scores. The agent extracts matched sequences, annotates them with HMMER or InterProScan, then joins the results by protein ID for a Quarto report.</desc>
  <rect width="960" height="218" rx="18" fill="#0a1222"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="39" font-size="29" fill="#edf4ff" font-weight="700">A protein annotation workflow</text>
    <rect x="24" y="62" width="214.5" height="132" rx="12" fill="#101e33" stroke="#354b67"/>
    <path d="M39 80h22" stroke="#f5ce79" stroke-width="3" stroke-linecap="round"/>
    <text x="39" y="114" font-size="23" fill="#edf4ff" font-weight="700">Search proteins</text>
    <text x="39" y="148" font-size="20" fill="#c7d4e6" font-weight="400">MMseqs2 returns</text>
    <text x="39" y="173" font-size="20" fill="#c7d4e6" font-weight="400">hit IDs and scores.</text>
    <path d="M242.5 128h10 M248.5 124l4 4-4 4" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="256.5" y="62" width="214.5" height="132" rx="12" fill="#101e33" stroke="#354b67"/>
    <path d="M271.5 80h22" stroke="#70dfd2" stroke-width="3" stroke-linecap="round"/>
    <text x="271.5" y="114" font-size="23" fill="#edf4ff" font-weight="700">Extract matches</text>
    <text x="271.5" y="148" font-size="20" fill="#c7d4e6" font-weight="400">Pull FASTA records</text>
    <text x="271.5" y="173" font-size="20" fill="#c7d4e6" font-weight="400">by hit ID.</text>
    <path d="M475 128h10 M481 124l4 4-4 4" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="489" y="62" width="214.5" height="132" rx="12" fill="#101e33" stroke="#354b67"/>
    <path d="M504 80h22" stroke="#9ac2ff" stroke-width="3" stroke-linecap="round"/>
    <text x="504" y="114" font-size="21" fill="#edf4ff" font-weight="700">Annotate domains</text>
    <text x="504" y="148" font-size="20" fill="#c7d4e6" font-weight="400">Use HMMER or</text>
    <text x="504" y="173" font-size="20" fill="#c7d4e6" font-weight="400">InterProScan.</text>
    <path d="M707.5 128h10 M713.5 124l4 4-4 4" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="721.5" y="62" width="214.5" height="132" rx="12" fill="#101e33" stroke="#354b67"/>
    <path d="M736.5 80h22" stroke="#eaa4d9" stroke-width="3" stroke-linecap="round"/>
    <text x="736.5" y="114" font-size="23" fill="#edf4ff" font-weight="700">Build the report</text>
    <text x="736.5" y="148" font-size="20" fill="#c7d4e6" font-weight="400">Join by protein ID</text>
    <text x="736.5" y="173" font-size="20" fill="#c7d4e6" font-weight="400">Render with Quarto.</text>
  </g>
</svg>
