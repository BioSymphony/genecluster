<svg xmlns="http://www.w3.org/2000/svg" width="420" height="459" viewBox="0 0 420 459" role="img" aria-labelledby="title desc">
  <title id="title">A protein annotation workflow</title>
  <desc id="desc">MMseqs2 returns hit IDs and scores. The agent extracts matched sequences, annotates them with HMMER or InterProScan, then joins the results by protein ID for a Quarto report.</desc>
  <rect width="420" height="459" rx="18" fill="#0a1222"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="16" y="36" font-size="23" fill="#edf4ff" font-weight="700">A protein annotation workflow</text>
    <rect x="16" y="57" width="388" height="80" rx="12" fill="#101e33" stroke="#354b67"/>
    <circle cx="40" cy="85" r="12" fill="#f5ce79"/>
    <text x="40" y="90" text-anchor="middle" font-size="15" fill="#0a1222" font-weight="700">1</text>
    <text x="61" y="91" font-size="23" fill="#edf4ff" font-weight="700">Search proteins</text>
    <text x="32" y="120" font-size="18" fill="#c7d4e6" font-weight="400">MMseqs2 returns hit IDs and scores.</text>
    <path d="M210 142v12 M205 149l5 5 5-5" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="159" width="388" height="80" rx="12" fill="#101e33" stroke="#354b67"/>
    <circle cx="40" cy="187" r="12" fill="#70dfd2"/>
    <text x="40" y="192" text-anchor="middle" font-size="15" fill="#0a1222" font-weight="700">2</text>
    <text x="61" y="193" font-size="23" fill="#edf4ff" font-weight="700">Extract matches</text>
    <text x="32" y="222" font-size="18" fill="#c7d4e6" font-weight="400">Pull protein FASTA records by hit ID.</text>
    <path d="M210 244v12 M205 251l5 5 5-5" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="261" width="388" height="80" rx="12" fill="#101e33" stroke="#354b67"/>
    <circle cx="40" cy="289" r="12" fill="#9ac2ff"/>
    <text x="40" y="294" text-anchor="middle" font-size="15" fill="#0a1222" font-weight="700">3</text>
    <text x="61" y="295" font-size="23" fill="#edf4ff" font-weight="700">Annotate domains</text>
    <text x="32" y="324" font-size="18" fill="#c7d4e6" font-weight="400">Use HMMER or InterProScan.</text>
    <path d="M210 346v12 M205 353l5 5 5-5" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="363" width="388" height="80" rx="12" fill="#101e33" stroke="#354b67"/>
    <circle cx="40" cy="391" r="12" fill="#eaa4d9"/>
    <text x="40" y="396" text-anchor="middle" font-size="15" fill="#0a1222" font-weight="700">4</text>
    <text x="61" y="397" font-size="23" fill="#edf4ff" font-weight="700">Build the report</text>
    <text x="32" y="426" font-size="18" fill="#c7d4e6" font-weight="400">Join by protein ID and render with Quarto.</text>
  </g>
</svg>
