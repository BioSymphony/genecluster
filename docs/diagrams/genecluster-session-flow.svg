<svg xmlns="http://www.w3.org/2000/svg" width="960" height="218" viewBox="0 0 960 218" role="img" aria-labelledby="title desc">
  <title id="title">How your agent uses GeneCluster</title>
  <desc id="desc">The agent reads the tool guides, sets up and runs the tools, then checks results and prepares the next input.</desc>
  <rect width="960" height="218" rx="18" fill="#0a1222"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="39" font-size="29" fill="#edf4ff" font-weight="700">How your agent uses GeneCluster</text>
    <rect x="24" y="62" width="292" height="132" rx="12" fill="#101e33" stroke="#354b67"/>
    <path d="M39 80h22" stroke="#f5ce79" stroke-width="3" stroke-linecap="round"/>
    <text x="39" y="114" font-size="26" fill="#edf4ff" font-weight="700">Choose tools</text>
    <text x="39" y="148" font-size="20" fill="#c7d4e6" font-weight="400">Match tools to the</text>
    <text x="39" y="173" font-size="20" fill="#c7d4e6" font-weight="400">question and data.</text>
    <path d="M320 128h10 M326 124l4 4-4 4" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="334" y="62" width="292" height="132" rx="12" fill="#101e33" stroke="#354b67"/>
    <path d="M349 80h22" stroke="#70dfd2" stroke-width="3" stroke-linecap="round"/>
    <text x="349" y="114" font-size="26" fill="#edf4ff" font-weight="700">Set up and run</text>
    <text x="349" y="148" font-size="20" fill="#c7d4e6" font-weight="400">Set up dependencies</text>
    <text x="349" y="173" font-size="20" fill="#c7d4e6" font-weight="400">and call the tools.</text>
    <path d="M630 128h10 M636 124l4 4-4 4" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="644" y="62" width="292" height="132" rx="12" fill="#101e33" stroke="#354b67"/>
    <path d="M659 80h22" stroke="#eaa4d9" stroke-width="3" stroke-linecap="round"/>
    <text x="659" y="114" font-size="26" fill="#edf4ff" font-weight="700">Connect results</text>
    <text x="659" y="148" font-size="20" fill="#c7d4e6" font-weight="400">Check outputs and</text>
    <text x="659" y="173" font-size="20" fill="#c7d4e6" font-weight="400">prepare the next input.</text>
  </g>
</svg>
