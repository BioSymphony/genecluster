<svg xmlns="http://www.w3.org/2000/svg" width="420" height="357" viewBox="0 0 420 357" role="img" aria-labelledby="title desc">
  <title id="title">How your agent uses GeneCluster</title>
  <desc id="desc">The agent reads the tool guides, sets up and runs the tools, then checks results and prepares the next input.</desc>
  <rect width="420" height="357" rx="18" fill="#0a1222"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="16" y="36" font-size="23" fill="#edf4ff" font-weight="700">How your agent uses GeneCluster</text>
    <rect x="16" y="57" width="388" height="80" rx="12" fill="#101e33" stroke="#354b67"/>
    <circle cx="40" cy="85" r="12" fill="#f5ce79"/>
    <text x="40" y="90" text-anchor="middle" font-size="15" fill="#0a1222" font-weight="700">1</text>
    <text x="61" y="91" font-size="23" fill="#edf4ff" font-weight="700">Choose tools</text>
    <text x="32" y="120" font-size="18" fill="#c7d4e6" font-weight="400">Match tools to the question and data.</text>
    <path d="M210 142v12 M205 149l5 5 5-5" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="159" width="388" height="80" rx="12" fill="#101e33" stroke="#354b67"/>
    <circle cx="40" cy="187" r="12" fill="#70dfd2"/>
    <text x="40" y="192" text-anchor="middle" font-size="15" fill="#0a1222" font-weight="700">2</text>
    <text x="61" y="193" font-size="23" fill="#edf4ff" font-weight="700">Set up and run</text>
    <text x="32" y="222" font-size="18" fill="#c7d4e6" font-weight="400">Set up dependencies and call tools.</text>
    <path d="M210 244v12 M205 251l5 5 5-5" fill="none" stroke="#a3b9d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="261" width="388" height="80" rx="12" fill="#101e33" stroke="#354b67"/>
    <circle cx="40" cy="289" r="12" fill="#eaa4d9"/>
    <text x="40" y="294" text-anchor="middle" font-size="15" fill="#0a1222" font-weight="700">3</text>
    <text x="61" y="295" font-size="23" fill="#edf4ff" font-weight="700">Connect results</text>
    <text x="32" y="324" font-size="18" fill="#c7d4e6" font-weight="400">Check outputs and prepare the next input.</text>
  </g>
</svg>
